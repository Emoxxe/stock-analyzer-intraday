<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0b0f19"/>
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
  <!-- Candle 1 (Green) -->
  <line x1="20" y1="14" x2="20" y2="48" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="16" y="22" width="8" height="18" rx="2" fill="#10b981"/>
  <!-- Candle 2 (Cyan/Purple breakout) -->
  <line x1="34" y1="10" x2="34" y2="52" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="30" y="16" width="8" height="24" rx="2" fill="url(#grad)"/>
  <!-- Candle 3 (Green surge) -->
  <line x1="48" y1="8" x2="48" y2="44" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="44" y="12" width="8" height="20" rx="2" fill="#22c55e"/>
</svg>
